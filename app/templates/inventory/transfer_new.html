{% extends "base.html" %}
{% block title %}New transfer &middot; Amna POS{% endblock %}

{% block content %}
{% set ctx = current_context() %}
<div class="page-head">
  <div>
    <h1>New transfer</h1>
  </div>
  <div class="page-actions">
    <a class="btn" href="{{ url_for('inventory.transfers') }}">Back to transfers</a>
  </div>
</div>

<form method="post" class="card" style="max-width:620px">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="body">
    <div class="form-row">
      <label for="to_branch_id">Send to <span class="req">*</span></label>
      <select id="to_branch_id" name="to_branch_id" required>
        <option value="">Choose a branch</option>
        {% for branch in branches %}
          <option value="{{ branch.id }}">{{ branch.code }} &middot; {{ branch.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label for="item_id">Item <span class="req">*</span></label>
      <select id="item_id" name="item_id" required>
        <option value="">Choose an item</option>
        {% for item in items %}
          <option value="{{ item.id }}">{{ item.sku }} &middot; {{ item.name }} ({{ item.unit }})</option>
        {% endfor %}
      </select>
    </div>
    <div class="form-row">
      <label for="quantity">Quantity <span class="req">*</span></label>
      <input type="number" step="0.001" min="0.001" id="quantity" name="quantity" required>
    </div>
    <div class="form-row">
      <label for="note">Note</label>
      <input type="text" id="note" name="note" maxlength="200" placeholder="Optional">
    </div>
    <div class="note">Both branches must belong to this business. Stock leaves the sending branch immediately.</div>
  </div>
  <div class="body" style="border-top:1px solid var(--line)">
    <button class="btn primary" type="submit">Post transfer</button>
  </div>
</form>
{% endblock %}
