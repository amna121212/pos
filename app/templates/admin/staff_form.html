{% extends "base.html" %}
{% block title %}{{ 'Edit employee' if membership else 'Add employee' }} &middot; Amna POS{% endblock %}

{% block content %}
<div class="page-head">
  <div>
    <h1>{{ 'Edit employee' if membership else 'Add employee' }}</h1>
  </div>
  <div class="page-actions">
    <a class="btn" href="{{ url_for('admin.staff') }}">Back to employees</a>
  </div>
</div>

<form method="post" class="card" style="max-width:680px"
      action="{{ url_for('admin.staff_edit', membership_id=membership.id) if membership else url_for('admin.staff_new') }}">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <div class="body">
    <div class="form-grid">
      <div class="form-row">
        <label for="display_name">Name <span class="req">*</span></label>
        <input type="text" id="display_name" name="display_name" value="{{ values.display_name }}" maxlength="100" required autofocus>
      </div>
      <div class="form-row">
        <label for="email">Email <span class="req">*</span></label>
        <input type="email" id="email" name="email" value="{{ values.email }}" maxlength="150"
               {{ 'readonly' if membership }} required>
              </div>
      <div class="form-row">
        <label for="role">Role <span class="req">*</span></label>
        <select id="role" name="role" required>
          {% for role in roles %}
            <option value="{{ role }}" {{ 'selected' if values.role == role }}>{{ role|label }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-row">
        <label for="branch_id">Branch</label>
        <select id="branch_id" name="branch_id">
          <option value="">All branches</option>
          {% for branch in branches %}
            <option value="{{ branch.id }}" {{ 'selected' if values.branch_id == branch.id|string }}>{{ branch.code }} &middot; {{ branch.name }}</option>
          {% endfor %}
        </select>
      </div>
    </div>

    <div class="form-row">
      <label for="password">{{ 'New password' if membership else 'Password' }}
        {% if not membership %}<span class="req">*</span>{% endif %}</label>
      <input type="password" id="password" name="password" minlength="8" autocomplete="new-password"
             {{ 'required' if not membership }}>
    </div>
  </div>
  <div class="body" style="border-top:1px solid var(--line);display:flex;gap:8px">
    <button class="btn primary" type="submit">{{ 'Save employee' if membership else 'Add employee' }}</button>
    <a class="btn" href="{{ url_for('admin.staff') }}">Cancel</a>
  </div>
</form>
{% endblock %}
