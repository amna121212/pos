{# Minimal 16px stroke icons. Inline so there is no icon-font dependency. #}
{% macro icon(name) -%}
<svg class="ico" viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor"
     stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  {%- if name == 'grid' -%}
    <rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/>
    <rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/>
  {%- elif name == 'cart' -%}
    <path d="M1.5 2h2l1.7 7.3h7.1L14 4.5H4"/><circle cx="6" cy="13" r="1.1"/><circle cx="12" cy="13" r="1.1"/>
  {%- elif name == 'receipt' -%}
    <path d="M3.5 1.8h9v12.4l-2-1.3-1.7 1.3-1.6-1.3-1.7 1.3-2-1.3z"/>
    <path d="M6 5.2h4M6 7.8h4M6 10.4h2.5"/>
  {%- elif name == 'flame' -%}
    <path d="M8 1.8s3.6 3 3.6 6.1a3.6 3.6 0 0 1-7.2 0C4.4 5.6 8 1.8 8 1.8z"/>
    <path d="M8 7.6c1 1 1.4 1.7 1.4 2.5a1.4 1.4 0 0 1-2.8 0c0-.8.4-1.5 1.4-2.5z"/>
  {%- elif name == 'box' -%}
    <path d="M2 5.2 8 2l6 3.2v5.6L8 14l-6-3.2z"/><path d="M2 5.2 8 8.4l6-3.2M8 8.4V14"/>
  {%- elif name == 'truck' -%}
    <path d="M1.5 3.5h7v7h-7z"/><path d="M8.5 6.5H12l2.5 2.2v1.8h-6z"/>
    <circle cx="4.2" cy="12" r="1.2"/><circle cx="11.6" cy="12" r="1.2"/>
  {%- elif name == 'chart' -%}
    <path d="M2 13.5V2"/><path d="M2 13.5h12"/><path d="M5 11V7M8 11V4.5M11 11V8.5"/>
  {%- elif name == 'store' -%}
    <path d="M2 6.2 3.2 2.5h9.6L14 6.2"/><path d="M2 6.2h12v1.3a2 2 0 0 1-4 0 2 2 0 0 1-4 0 2 2 0 0 1-4 0z"/>
    <path d="M3.5 8.6v5h9v-5"/>
  {%- elif name == 'users' -%}
    <circle cx="6" cy="5.4" r="2.2"/><path d="M2 13.4c0-2.2 1.8-3.6 4-3.6s4 1.4 4 3.6"/>
    <path d="M10.6 4a2 2 0 0 1 0 3.6M11.4 9.9c1.6.4 2.6 1.6 2.6 3.5"/>
  {%- elif name == 'gear' -%}
    <circle cx="8" cy="8" r="2.1"/>
    <path d="M8 1.8v1.6M8 12.6v1.6M1.8 8h1.6M12.6 8h1.6M3.6 3.6l1.1 1.1M11.3 11.3l1.1 1.1M12.4 3.6l-1.1 1.1M4.7 11.3l-1.1 1.1"/>
  {%- elif name == 'shield' -%}
    <path d="M8 1.8 13 3.6v4.1c0 3-2.1 5.2-5 6.5-2.9-1.3-5-3.5-5-6.5V3.6z"/>
    <path d="M5.8 7.8 7.4 9.4l3-3"/>
  {%- elif name == 'clock' -%}
    <circle cx="8" cy="8" r="6.1"/><path d="M8 4.4V8l2.4 1.6"/>
  {%- elif name == 'tag' -%}
    <path d="M2 2h5.4l6.6 6.6-5.4 5.4L2 7.4z"/><circle cx="5" cy="5" r="1"/>
  {%- endif -%}
</svg>
{%- endmacro %}
